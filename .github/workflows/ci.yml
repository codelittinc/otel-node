name: CI

# pull_request only (never pull_request_target): a fork's PR runs with no secrets and a
# read-only token. Nothing is published from here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Apps install this repo by commit, so the committed dist/ must be exactly a fresh build.
      - name: dist/ matches a fresh build
        run: |
          pnpm build
          git diff --exit-code -- dist
          untracked="$(git status --porcelain -- dist)"
          if [ -n "$untracked" ]; then
            echo "dist/ differs from a fresh build:"
            echo "$untracked"
            exit 1
          fi
